name: Update previous day's energy data

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: write

concurrency:
  group: update-daily-energy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GOODWE_USERNAME: ${{ secrets.GOODWE_USERNAME }}
      GOODWE_PASSWORD: ${{ secrets.GOODWE_PASSWORD }}
      STATION_ID: ${{ secrets.STATION_ID }}
      SEMS_PLATFORM: plus
      PLAYWRIGHT_HEADLESS: "true"
      TZ: America/Los_Angeles

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-python.txt
          python -m playwright install --with-deps chromium

      - name: Calculate previous date
        run: |
          target_date="$(date --date='yesterday' +%F)"
          echo "TARGET_DATE=${target_date}" >> "$GITHUB_ENV"
          echo "Downloading data for ${target_date}"

      - name: Download previous day's data
        run: python scripts/get_data.py --date "$TARGET_DATE"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/energy.html
          git add "docs/goodwe-exports/${TARGET_DATE}_power.xls"
          git add "docs/goodwe-exports/${TARGET_DATE}_solarpanel.html"

          if git diff --cached --quiet; then
            echo "No data changes for ${TARGET_DATE}"
            exit 0
          fi

          git commit -m "Update energy data for ${TARGET_DATE}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
